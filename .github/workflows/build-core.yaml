name: Build Core Binaries

# Push a version tag (e.g. v3.0.0.1) to build every OS and attach the artifacts
# to the GitHub release. Or run manually (workflow_dispatch) to build without
# releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---- Linux (x86_64) + Windows (x86_64) via the Dockerized depends build ----
  linux-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux + Windows (Docker + depends)
        run: scripts/build-core-docker.sh linux win

      - uses: actions/upload-artifact@v4
        with:
          name: core-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # macOS is NOT built here. This old BCHN `depends` doesn't support Apple
  # Silicon (`config.sub` can't resolve arm64-apple-darwin -> empty host_os ->
  # `hosts/.mk`), and `depends` on a native runner is the wrong approach anyway.
  # macOS is built manually via Homebrew — see doc/build-osx.md and the seed/
  # release runbook. Revisit as a Homebrew-native CI job (brew install qt5 boost
  # berkeley-db libevent ... + native cmake) if we want it automated later.

  # ---- On a tag: collect everything, checksum, attach to the release ----
  #
  # This job is the SOLE publisher of release assets. Do not also create or
  # upload a release by hand: this action overwrites assets of the same name,
  # so whichever producer finishes last wins and any checksums recorded from
  # the other one describe an artifact that no longer exists. That happened on
  # v3.1.0 and left every node refusing to upgrade. See doc/releasing.md.
  release:
    needs: [linux-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksum
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
