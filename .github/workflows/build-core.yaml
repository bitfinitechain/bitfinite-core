name: Build Core Binaries

# Push a version tag (e.g. v3.0.0.1) to build every OS and attach the artifacts
# to the GitHub release. Or run manually (workflow_dispatch) to build without
# releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---- Linux (x86_64) + Windows (x86_64) via the Dockerized depends build ----
  linux-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux + Windows (Docker + depends)
        run: scripts/build-core-docker.sh linux win

      - uses: actions/upload-artifact@v4
        with:
          name: core-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ---- macOS (arm64) natively on a GitHub macOS runner (has the real SDK) ----
  # Using the runner avoids the osxcross / macOS-SDK-licensing problem entirely.
  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install automake libtool pkg-config ninja

      - name: Build macOS dependencies (depends)
        run: make -C depends -j"$(sysctl -n hw.ncpu)" HOST=arm64-apple-darwin

      - name: Configure + build
        run: |
          cmake -GNinja -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=cmake/platforms/OSX.cmake \
            -DENABLE_MAN=OFF -DBUILD_BITCOIN_SEEDER=OFF
          ninja -C build bitfinited bitfinite-cli bitfinite-tx bitfinite-wallet bitfinite-qt

      # Distribution-quality macOS needs code-signing + notarization here, using
      # repo secrets (Apple Developer ID cert + app-specific password). Until
      # those are set up, this produces an UNSIGNED build (users must
      # right-click -> Open). Signing example:
      #   codesign --deep --force --options runtime --sign "$APPLE_DEV_ID" build/src/qt/BitFinite-Qt.app
      #   xcrun notarytool submit ... --wait
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"; [ -z "$VER" ] && VER="dev"
          NAME="bitfinite-v${VER}-arm64-macos"
          mkdir -p "dist/$NAME/bin"
          for b in bitfinited bitfinite-cli bitfinite-tx bitfinite-wallet; do cp "build/src/$b" "dist/$NAME/bin/"; done
          cp build/src/qt/bitfinite-qt "dist/$NAME/bin/" || true
          strip "dist/$NAME"/bin/* 2>/dev/null || true
          ( cd "dist/$NAME/bin" && shasum -a 256 * ) > "dist/$NAME/SHA256SUMS"
          ( cd dist && tar czf "$NAME.tar.gz" "$NAME" )

      - uses: actions/upload-artifact@v4
        with:
          name: core-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---- On a tag: collect everything, checksum, attach to the release ----
  release:
    needs: [linux-windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksum
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
